name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.crm.crowncar.id

      # TODO: confirm this matches the actual nginx root for crm.crowncar.id
      # before relying on this step (see /var/www/crown/dist as the pattern
      # used for the crown repo).
      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: rsync -av --delete dist/ /var/www/crm-q/crm-fe/dist/
